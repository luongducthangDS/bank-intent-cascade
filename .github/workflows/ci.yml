name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install numpy scikit-learn fastapi httpx pytest pydantic
      # policy + API contract tests use a stub model, so CI needs no model weights
      - run: pytest -q
